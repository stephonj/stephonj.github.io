<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 8 - If Statements</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Assignment 8</h1>
            <h2>If Statements</h2>
            
            <!-- Mobile Menu Toggle -->
            <div class="menu-toggle" id="menuToggle">
                <span class="arrow">▼</span>
            </div>
            
            <!-- Navigation -->
            <nav class="nav" id="nav">
                <ul>
                    <li><a href="#" id="exercise1Link">Exercise 1</a></li>
                    <li><a href="#" id="exercise2Link">Exercise 2</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Exercise 1: Plant Section -->
        <section id="plantingSection" class="content-section">
            <h3>How many days has it been since watering your plant?</h3>
            
            <div class="slider-container">
                <input type="range" id="plantSlider" min="1" max="12" value="1" class="slider">
                <div class="slider-track"></div>
            </div>
            
            <div id="plantResult" class="plant-result">
                <div class="plant-image">
                    <img id="plantImage" src="images/plant-healthy.jpeg" alt="Plant status">
                </div>
                <div class="plant-message">
                    <p id="daysMessage">It's been 1 days since watering your plant</p>
                    <p id="statusMessage">Your plant is healthy and happy</p>
                </div>
            </div>
        </section>

        <!-- Exercise 2: Digital Clock Section -->
        <section id="digitalClockSection" class="content-section hidden">
            <div class="clock-container">
                <h3>Our Digital Clock</h3>
                <div id="digitalClock" class="digital-clock">10:00 am</div>
            </div>
        </section>
    </main>

    <footer>
        <p>@stephonjohnson.com</p>
    </footer>

    <script src="intro.js"></script>
</body>
</html>
