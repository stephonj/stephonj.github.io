<!DOCTYPE html>
<html lang="en">
<head>
    <title>GamesOnGames - Catalog</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="header">
    <div class="header-content">
        <div class="logo">🎮</div>
        <input type="checkbox" id="menu-toggle" />
        <label for="menu-toggle" class="hamburger">
            <span></span><span></span><span></span>
        </label>
        <nav class="nav">
            <ul>
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="catalog.html" class="nav-link active">Catalog</a></li>
                <li><a href="wishlist.html" class="nav-link">Wishlist</a></li>
                <li><a href="reviews.html" class="nav-link">Review</a></li>
                <li><a href="contact.html" class="nav-link">Contact Us</a></li>
            </ul>
        </nav>
    </div>
</header>

<main class="container">
    <h1>Catalog</h1>
    <div class="catalog-container">
        <div class="filters">
            <!-- Platform Filter -->
            <div class="filter-section">
                <h3>Platform</h3>
                <div class="filter-options">
                    <div>PC</div>
                    <div>PS4/PS5</div>
                    <div>PS4</div>
                    <div>PS2</div>
                    <div>PS3</div>
                    <div>Nintendo</div>
                    <div>Xbox One</div>
                </div>
            </div>
            <!-- Genre Filter -->
            <div class="filter-section">
                <h3>Genre</h3>
                <div class="filter-options">
                    <div>Sports</div>
                    <div>RPG</div>
                    <div>Adventure</div>
                </div>
            </div>
            <!-- Price Filter -->
            <div class="filter-section">
                <h3>Price</h3>
                <div class="filter-options">
                    <div>Under $20.00</div>
                    <div>$20.00 - $40.00</div>
                    <div>$40 and Above</div>
                </div>
            </div>
        </div>

        <div>
            <div class="catalog-grid">

            </div>

            <div class="pagination">
                <span class="active">1</span>
                <span>2</span>
                <span>3</span>
                <span>4</span>
                <span>5</span>
                <span>6</span>
            </div>
        </div>
    </div>
</main>

<script src="catalog.js"></script>
</body>
</html>
